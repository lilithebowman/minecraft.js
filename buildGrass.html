<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Build Grass Block Atlas</title>
	<style>
		body {
			background: #222;
			color: #eee;
			font-family: sans-serif;
		}

		#atlas-preview {
			border: 2px solid #888;
			margin-top: 20px;
		}
	</style>
</head>

<body>
	<h1>Grass Block Atlas Builder</h1>
	<canvas id="atlas-preview" width="192" height="128"></canvas>
	<script type="module">
		import buildGrassAtlas from './js/buildGrass.js';
		import TextureAtlasBuilder from './js/TextureAtlasBuilder.js';

async function run() {
    // Create a WebGL context
    const canvas = document.createElement('canvas');
    canvas.width = 192;
    canvas.height = 128;
    const gl = canvas.getContext('webgl');
    if (!gl) {
        document.body.innerHTML += '<p>WebGL not supported.</p>';
        return;
    }
    try {
        // Build the atlas
        const atlasTexture = await buildGrassAtlas(gl);
        // Display the atlas using 2D canvas
    } finally {
        // Clean up WebGL context
        const loseContext = gl.getExtension('WEBGL_lose_context');
        if (loseContext) {
            loseContext.loseContext();
        }
    }
}
			// Get the atlas canvas from TextureAtlasBuilder
			// We'll need to modify TextureAtlasBuilder to expose the canvas
			// For now, re-build the atlas on the preview canvas
			const previewCanvas = document.getElementById('atlas-preview');
			const previewCtx = previewCanvas.getContext('2d');
			// Use same logic as buildGrassAtlas to draw images
			const cellSize = 64;
			const imageInfos = [
				{ url: 'textures/mc_grass_side.png', x: 0, y: 0 },
				{ url: 'textures/mc_grass_top.png', x: 1, y: 0 },
				{ url: 'textures/mc_grass_bottom.png', x: 2, y: 0 },
				{ url: 'textures/mc_grass_side.png', x: 0, y: 1 },
				{ url: 'textures/mc_grass_side.png', x: 1, y: 1 },
				{ url: 'textures/mc_grass_side.png', x: 2, y: 1 }
			];
			for (const info of imageInfos) {
				const img = await new Promise(res => {
					const i = new Image();
					i.src = info.url;
					i.onload = () => res(i);
					i.onerror = () => {
						console.error(`Failed to load texture: ${info.url}`);
						// Create placeholder or skip
						res(null);
					};
				});
				if (img) {
					previewCtx.drawImage(
						img,
						info.x * cellSize,
						info.y * cellSize,
						cellSize,
						cellSize
					);
				} else {
					// Draw placeholder for failed textures
					previewCtx.fillStyle = '#ff00ff';
					previewCtx.fillRect(
						info.x * cellSize,
						info.y * cellSize,
						cellSize,
						cellSize
					);
				}
			}
		}
		run();
	</script>
</body>

</html>
