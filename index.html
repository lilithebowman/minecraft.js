<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Minecraft.js - CSS Edition</title>
	<link rel="stylesheet" href="styles/main.css">
</head>

<body>
	<div id="game-container">
		<div id="viewport" class="viewport">
			<div id="world" class="world"></div>
		</div>

		<div id="ui" class="ui">
			<div id="crosshair" class="crosshair"></div>
			<div id="debug-panel" class="debug-panel">
				<div id="fps-counter">FPS: 0</div>
				<div id="position-info">Position: 0, 0, 0</div>
				<div id="chunk-info">Chunk: 0, 0</div>
				<div id="block-info">Looking at: none</div>
			</div>
			<div id="controls-info" class="controls-info">
				<div>WASD: Move</div>
				<div>Mouse: Look around</div>
				<div>Space: Jump</div>
				<div>Left Click: Break block</div>
				<div>Right Click: Place block</div>
				<div>F3: Toggle debug</div>
			</div>
		</div>
	</div>

	<script type="module" src="js/main.js"></script>
</body>

</html>
