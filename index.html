<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Minecraft.js WebGL Renderer</title>
	<link rel="stylesheet" href="styles/main.css">
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #87ceeb;
		}

		#game-canvas {
			display: block;
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
		}
	</style>
</head>

<body>
	<canvas id="game-canvas"></canvas>
	<script type="module" src="js/main.js"></script>
</body>

</html>
